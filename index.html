
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#25364a" />
  <meta name="description" content="SSW PM Mock Test by Faiz — Simulator ujian mandiri 特定技能1号・飲食料品製造業 (食品製造) dengan bank soal lokal dan mode offline." />

  <title>SSW PM Mock Test by Faiz — 特定技能1号・飲食料品製造業</title>

  <!-- ICON & MANIFEST -->
  <link rel="icon" href="./hasbulla-192.png.png" type="image/png" />
  <link rel="apple-touch-icon" href="./hasbulla-192.png.png" />
  <link rel="manifest" href="./manifest.webmanifest?v=ssw12" />

  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="./styles.css?v=ssw12" />

  <!-- CSS TAMBAHAN -->
  <link rel="stylesheet" href="./CSV-IMPORT-STYLES.css?v=ssw3" />
  <link rel="stylesheet" href="./RICH-HTML-STYLES.css?v=ssw3" />
  <link rel="stylesheet" href="./QUESTION-EDITOR-UPDATES.css?v=ssw12" />

  <!-- SERVICE WORKER CACHE CLEANUP -->
  <script>
    (function () {
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              if (
                key.indexOf('jft-practice') !== -1 ||
                (key.indexOf('ssw-pm-mock-test-shell-') === 0 && key !== 'ssw-pm-mock-test-shell-v11')
              ) {
                caches.delete(key);
              }
            });
          });
        }
      } catch (error) {
        console.warn('Service Worker cache cleanup:', error);
      }
    })();
  </script>

  <!-- GLOBAL ERROR HANDLER -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('Global error:', e);

      var view = document.getElementById('view');

      if (
        view &&
        !view.querySelector('.stats-grid') &&
        !view.querySelector('.exam-shell')
      ) {
        view.innerHTML =
          '<section class="panel" style="padding:24px;border-left:4px solid #b53b3b;">' +
          '<strong style="color:#b53b3b;font-size:16px;">Terjadi Kendala Memuat Aplikasi</strong>' +
          '<p style="margin:8px 0;font-size:13px;line-height:1.6;">' +
          (e.message || 'Gagal memuat skrip modul JavaScript.') +
          '</p>' +
          '<p style="font-size:12px;color:#666;">File: ' +
          (e.filename || 'app.js') +
          ' (baris ' +
          (e.lineno || '?') +
          ')</p>' +
          '<button class="button button-primary" style="margin-top:12px;" onclick="location.reload()">Muat Ulang</button>' +
          '</section>';
      }
    });
  </script>
</head>

<body>
  <div id="app" class="app-shell">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div>
          <strong id="sidebar-brand-title">SSW PM MOCK TEST</strong>
          <small id="sidebar-brand-sub">BY FAIZ · 飲食料品製造業</small>
        </div>
      </div>

      <nav class="main-nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">⌂</span>
          <span data-i18n="navHome">Beranda</span>
        </button>

        <button class="nav-item" data-page="setup">
          <span class="nav-icon">▣</span>
          <span data-i18n="navSetup">Mulai Mock Test</span>
        </button>

        <button class="nav-item" data-page="bank">
          <span class="nav-icon">▤</span>
          <span data-i18n="navBank">Bank Soal</span>
        </button>

        <button class="nav-item" data-page="history">
          <span class="nav-icon">◷</span>
          <span data-i18n="navHistory">Riwayat Hasil</span>
        </button>

        <button class="nav-item" data-page="backup">
          <span class="nav-icon">⇅</span>
          <span data-i18n="navBackup">Backup &amp; Data</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="offline-pill">
          <span class="status-dot"></span>
          <span id="connection-label">Penyimpanan lokal aktif</span>
        </div>

        <p id="sidebar-disclaimer">
          Simulator latihan ujian SSW PM
          (特定技能1号・飲食料品製造業).
          Independen &amp; tersimpan di perangkat ini.
        </p>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-area">

      <!-- TOPBAR -->
      <header class="topbar">
        <button
          id="mobile-menu"
          class="icon-button mobile-only"
          aria-label="Buka navigasi"
        >☰</button>

        <div class="breadcrumbs" id="breadcrumbs">
          Beranda
        </div>

        <div class="topbar-right">
          <label class="lang-Segment" aria-label="Language / Bahasa">
            <select
              id="global-lang-select"
              class="lang-select"
              title="Ubah Bahasa Antarmuka / Change Interface Language"
            >
              <option value="id">🇮🇩 Bahasa Indonesia</option>
              <option value="en">🇬🇧 English</option>
              <option value="ja">🇯🇵 日本語</option>
            </select>
          </label>

          <span class="local-chip">
            <span class="status-dot"></span>
            特定技能1号・飲食料品製造業
          </span>

          <button
            class="button button-small button-outline"
            data-page="backup"
            id="topbar-backup-btn"
          >
            Backup &amp; Data
          </button>
        </div>
      </header>

      <!-- APP VIEW -->
      <div id="view" class="page-content" tabindex="-1">
        <section class="panel" style="padding:24px;">
          <strong>Memuat SSW PM Mock Test by Faiz…</strong>
          <p style="margin-top:6px;">
            Menyiapkan bank soal 特定技能1号・飲食料品製造業
            (Kunci Soal Ujian 1 — CBTP Gino1).
          </p>
        </section>
      </div>
    </main>
  </div>

  <!-- MODALS & NOTIFICATIONS -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- MAIN JAVASCRIPT -->
  <script type="module" src="./app.js?v=ssw12"></script>
</body>
</html>
