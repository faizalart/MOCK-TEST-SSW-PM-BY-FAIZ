  <script>
    (function () {
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf('jft-practice') !== -1 || k.indexOf('ssw-pm-mock-test-shell-v1') !== -1 || k.indexOf('ssw-pm-mock-test-shell-v2') !== -1) {
                caches.delete(k);
              }
            });
          });
        }
        if ('serviceWorker' in navigator && !localStorage.getItem('ssw_pm_sw_migrated_v3')) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadOld = regs.length > 0;
            Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
              localStorage.setItem('ssw_pm_sw_migrated_v3', '1');
              if (hadOld && navigator.serviceWorker.controller) {
                location.reload();
              }
            });
          });
        }
      } catch (e) {}
    })();
  </script>
</head>
